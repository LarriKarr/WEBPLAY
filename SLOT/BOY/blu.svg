<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Тень под свертком -->
    <radialGradient id="shadowGradBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.6)" />
      <stop offset="60%" stop-color="rgba(0,0,0,0.2)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>

    <!-- Основной синий градиент -->
    <linearGradient id="blueTapeGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#2980b9" />
      <stop offset="40%" stop-color="#0056b3" />
      <stop offset="75%" stop-color="#002d62" />
      <stop offset="100%" stop-color="#00122e" />
    </linearGradient>

    <!-- Глянцевый блик -->
    <linearGradient id="blueHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>

    <!-- Фильтр объемной тени -->
    <filter id="softShadowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#00122e" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Фон -->
  <rect width="100%" height="100%" fill="#f4f4f600" />

  <g transform="translate(0, 20)">
    <!-- Тень на столе -->
    <ellipse cx="250" cy="360" rx="90" ry="22" fill="url(#shadowGradBlue)" />

    <!-- Основная неровная форма свертка -->
    <g filter="url(#softShadowBlue)">
      <!-- Базовый слой полностью покрывает форму -->
      <path d="M 210,170 
               C 240,155 280,165 310,185 
               C 335,200 350,230 345,265 
               C 340,300 315,335 285,345 
               C 255,355 205,350 180,330 
               C 155,310 145,270 155,235 
               C 165,200 185,180 210,170 Z" 
            fill="url(#blueTapeGrad)" />

      <!-- Слои и мотки изоленты -->
      <!-- Виток 1 (горизонтальный) -->
      <path d="M 155,235 C 190,215 260,205 325,225 C 335,235 330,255 315,265 C 255,245 190,250 152,260 Z" 
            fill="#004085" stroke="#002b5c" stroke-width="1.5" />
      
      <!-- Виток 2 (диагональный) -->
      <path d="M 185,170 C 225,190 275,250 295,338 C 280,345 265,342 250,328 C 235,250 192,198 170,182 Z" 
            fill="#0056b3" stroke="#003366" stroke-width="1.5" />

      <!-- Виток 3 (поперечный) -->
      <path d="M 152,250 C 190,270 260,290 342,272 C 344,288 332,312 305,328 C 240,332 180,308 155,272 Z" 
            fill="#0069d9" stroke="#003d7a" stroke-width="1.5" />

      <!-- Виток 4 (вертикальный перекрестный) -->
      <path d="M 230,162 C 255,160 270,170 275,190 C 260,240 250,290 245,352 C 230,351 215,345 210,335 C 220,280 230,220 230,162 Z" 
            fill="#007bff" stroke="#004085" stroke-width="1.5" />

      <!-- Верхний диагональный нахлест -->
      <path d="M 175,200 C 220,180 290,210 330,250 C 315,265 295,260 275,240 C 240,215 190,215 168,222 Z" 
            fill="#0052cc" stroke="#003399" stroke-width="1.5" />

      <!-- Складки и швы изоленты -->
      <path d="M 180,185 Q 220,210 240,270" stroke="#001f3f" stroke-width="2" fill="none" opacity="0.6" />
      <path d="M 220,165 Q 260,220 310,240" stroke="#66b2ff" stroke-width="1.5" fill="none" opacity="0.7" />
      <path d="M 155,260 Q 210,280 280,335" stroke="#00122e" stroke-width="2" fill="none" opacity="0.5" />
      <path d="M 270,180 Q 320,230 335,280" stroke="#99ccff" stroke-width="1.5" fill="none" opacity="0.6" />
      
      <!-- Загнутый хвостик изоленты -->
      <path d="M 260,250 L 290,265 L 285,280 L 255,262 Z" fill="#3399ff" stroke="#004085" stroke-width="1" />
      <line x1="290" y1="265" x2="285" y2="280" stroke="#ffffff" stroke-width="1" opacity="0.6" />

      <!-- Глянцевые блики -->
      <path d="M 195,178 C 225,168 260,175 285,190 C 260,185 220,182 195,190 Z" fill="url(#blueHighlight)" />
      <path d="M 165,220 C 180,200 210,190 230,195 C 205,200 185,210 165,230 Z" fill="url(#blueHighlight)" />
      <ellipse cx="295" cy="225" rx="15" ry="35" fill="url(#blueHighlight)" transform="rotate(-25 295 225)" />
    </g>
  </g>
</svg>
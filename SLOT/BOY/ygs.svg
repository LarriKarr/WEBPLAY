<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
<defs>
<!-- Тень под свертком -->
<radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="rgba(0,0,0,0.6)" />
<stop offset="60%" stop-color="rgba(0,0,0,0.2)" />
<stop offset="100%" stop-color="rgba(0,0,0,0)" />
</radialGradient>
​<!-- Объемная тень для придания формы шара/камня -->
<radialGradient id="volumeShading" cx="35%" cy="30%" r="70%">
<stop offset="0%" stop-color="rgba(255,255,255,0.25)" />
<stop offset="55%" stop-color="rgba(0,0,0,0)" />
<stop offset="85%" stop-color="rgba(0,25,0,0.55)" />
<stop offset="100%" stop-color="rgba(0,10,0,0.85)" />
</radialGradient>
​<!-- Глянцевый блик -->
<linearGradient id="tapeHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="rgba(255,255,255,0.6)" />
<stop offset="40%" stop-color="rgba(255,255,255,0.15)" />
<stop offset="100%" stop-color="rgba(255,255,255,0)" />
</linearGradient>
​<!-- Фильтр тени -->
<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#052000" flood-opacity="0.5"/>
</filter>
​<!-- Маска контура неровного свертка -->
<clipPath id="bundleClip">
<path d="M 210,170 
C 240,155 280,165 310,185 
C 335,200 350,230 345,265 
C 340,300 315,335 285,345 
C 255,355 205,350 180,330 
C 155,310 145,270 155,235 
C 165,200 185,180 210,170 Z" />
</clipPath>
</defs>
​<!-- Фон -->
<rect width="100%" height="100%" fill="#f4f4f600" />
​<g transform="translate(0, 20)">
<!-- Тень на столе -->
<ellipse cx="250" cy="360" rx="90" ry="22" fill="url(#shadowGrad)" />
​<!-- Основной объект -->
<g filter="url(#softShadow)">
<g clip-path="url(#bundleClip)">
​<!-- 0. БАЗОВЫЙ СПЛОШНОЙ СЛОЙ ОБМОТКИ (закрывает всё подложным желто-зеленым фоном) -->
<rect x="130" y="140" width="230" height="230" fill="#ffd700" />
<path d="M 130,150 L 370,390" stroke="#008837" stroke-width="25" stroke-dasharray="25,25" />
<path d="M 130,175 L 370,415" stroke="#008837" stroke-width="25" stroke-dasharray="25,25" />
<path d="M 130,125 L 370,365" stroke="#008837" stroke-width="25" stroke-dasharray="25,25" />
​<!-- 1. НИЖНИЙ ДИАГОНАЛЬНЫЙ ВИТОК (слева направо) -->
<g>
<path d="M 140,210 C 180,180 260,170 340,200 L 350,235 C 270,205 190,215 145,245 Z" fill="#ffd700" />
<path d="M 142,217 C 182,187 262,177 342,207" stroke="#008837" stroke-width="7" fill="none" />
<path d="M 144,227 C 184,197 264,187 344,217" stroke="#008837" stroke-width="7" fill="none" />
<path d="M 140,210 C 180,180 260,170 340,200" stroke="#004d1f" stroke-width="1.2" fill="none" />
<path d="M 145,245 C 190,215 270,205 350,235" stroke="#004d1f" stroke-width="1.2" fill="none" />
</g>
​<!-- 2. ВИТОК ПОДИУМА (слева снизу вверх направо) -->
<g>
<path d="M 160,330 C 180,260 220,190 290,165 L 315,190 C 255,210 215,275 190,345 Z" fill="#ffd700" />
<path d="M 168,333 C 188,263 228,193 298,168" stroke="#008837" stroke-width="7" fill="none" />
<path d="M 178,338 C 198,268 238,198 308,173" stroke="#008837" stroke-width="7" fill="none" />
<path d="M 160,330 C 180,260 220,190 290,165" stroke="#004d1f" stroke-width="1.2" fill="none" />
<path d="M 190,345 C 215,275 255,210 315,190" stroke="#004d1f" stroke-width="1.2" fill="none" />
</g>
​<!-- 3. ЦЕНТРАЛЬНЫЙ ПОПЕРЕЧНЫЙ ВИТОК -->
<g>
<path d="M 145,230 C 200,250 270,268 355,245 L 350,285 C 265,308 195,285 142,265 Z" fill="#ffd700" />
<path d="M 144,242 C 199,262 269,280 354,257" stroke="#008837" stroke-width="8" fill="none" />
<path d="M 143,254 C 197,274 267,293 351,271" stroke="#008837" stroke-width="7" fill="none" />
<path d="M 145,230 C 200,250 270,268 355,245" stroke="#004d1f" stroke-width="1.2" fill="none" />
<path d="M 142,265 C 195,285 265,308 350,285" stroke="#004d1f" stroke-width="1.2" fill="none" />
</g>
​<!-- 4. НИЖНИЙ ПЕРЕКРЫВАЮЩИЙ ВИТОК -->
<g>
<path d="M 155,275 C 215,305 275,318 335,305 L 325,342 C 265,355 205,338 150,305 Z" fill="#ffd700" />
<path d="M 153,285 C 213,315 273,328 333,315" stroke="#008837" stroke-width="7" fill="none" />
<path d="M 151,296 C 211,326 271,339 330,326" stroke="#008837" stroke-width="7" fill="none" />
<path d="M 155,275 C 215,305 275,318 335,305" stroke="#004d1f" stroke-width="1.2" fill="none" />
<path d="M 150,305 C 205,338 265,355 325,342" stroke="#004d1f" stroke-width="1.2" fill="none" />
</g>
​<!-- 5. ВЕРТИКАЛЬНЫЙ ВИТОК СПРАВА -->
<g>
<path d="M 275,170 C 310,210 325,260 318,335 L 285,342 C 293,270 278,215 250,180 Z" fill="#ffd700" />
<path d="M 267,173 C 302,213 317,263 310,338" stroke="#008837" stroke-width="7" fill="none" />
<path d="M 258,177 C 293,217 308,267 301,340" stroke="#008837" stroke-width="7" fill="none" />
<path d="M 275,170 C 310,210 325,260 318,335" stroke="#004d1f" stroke-width="1.2" fill="none" />
<path d="M 250,180 C 278,215 293,270 285,342" stroke="#004d1f" stroke-width="1.2" fill="none" />
</g>
​<!-- 6. ХВОСТИК/ОБРЫВ ИЗОЛЕНТЫ НА ПОВЕРХНОСТИ -->
<g transform="rotate(12, 275, 260)">
<path d="M 265,245 L 300,250 L 297,278 L 262,272 Z" fill="#ffd700" stroke="#004d1f" stroke-width="1.5" />
<path d="M 264,258 L 299,263" stroke="#008837" stroke-width="7" />
<line x1="300" y1="250" x2="297" y2="278" stroke="#ffffff" stroke-width="1" opacity="0.6" />
</g>
​<!-- 7. ОВЕРЛЕЙ ОБЪЕМА И СВЕТОТЕНИ -->
<path d="M 210,170 C 240,155 280,165 310,185 C 335,200 350,230 345,265 C 340,300 315,335 285,345 C 255,355 205,350 180,330 C 155,310 145,270 155,235 C 165,200 185,180 210,170 Z" 
fill="url(#volumeShading)" />
​<!-- 8. ГЛЯНЦЕВЫЕ БЛИКИ PVC-ИЗОЛЕНТЫ -->
<path d="M 195,178 C 225,168 260,175 285,190 C 260,185 220,182 195,190 Z" fill="url(#tapeHighlight)" />
<ellipse cx="295" cy="225" rx="15" ry="35" fill="url(#tapeHighlight)" transform="rotate(-25 295 225)" />
​</g>
</g>
</g>
</svg>
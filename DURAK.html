<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДУРАК</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle, #2c3e50 0%, #1a252f 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            max-width: 520px;
            width: 100%;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 1.4rem;
            letter-spacing: 3px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Панель управления */
        .controls-panel {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .toggle-group {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 3px;
            gap: 2px;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            padding: 5px 10px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
            min-width: 32px;
        }

        .toggle-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .toggle-btn.active {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .status {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #00e676;
            min-height: 20px;
        }

        /* Игровой стол */
        .table-area {
            width: 100%;
            height: 210px;
            background: rgba(34, 139, 34, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            padding: 10px;
        }

        /* Колода и козырь */
        .deck-zone {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
        }

        .trump-card-bg {
            position: absolute;
            left: 18px;
            transform: rotate(90deg);
        }

        /* Значок козырной масти, когда колода пуста */
        .trump-suit-empty {
            position: absolute;
            left: 10px;
            font-size: 2.5rem;
            opacity: 0.4;
            user-select: none;
        }

        .trump-suit-empty.red { color: #ff5252; }
        .trump-suit-empty.black { color: #ffffff; }

        .deck-count {
            position: absolute;
            top: -20px;
            left: 10px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #ffd700;
        }

        /* Зона боя (пары карт) */
        .table-cards {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            max-width: 320px;
        }

        .card-pair {
            position: relative;
            width: 50px;
            height: 75px;
        }

        .card-pair .defending-card {
            position: absolute;
            top: 12px;
            left: 10px;
        }

        /* Соперники (Боты) */
        .bots-info {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #ffd700;
            font-weight: bold;
        }

        .bot-badge {
            background: rgba(255,255,255,0.1);
            padding: 3px 8px;
            border-radius: 6px;
        }

        .bot-badge.active-attacker {
            border: 1px solid #00e676;
            color: #00e676;
        }

        .bot-badge.finished {
            opacity: 0.5;
            text-decoration: line-through;
            color: #00e676;
        }

        /* Карты */
        .card {
            width: 50px;
            height: 75px;
            background: #ffffff;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3px 4px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease;
        }

        .card.red { color: #d32f2f; }
        .card.black { color: #212121; }

        .card:hover {
            transform: translateY(-6px);
        }

        .card.card-back {
            background: linear-gradient(135deg, #1976d2, #0d47a1);
            border: 2px solid #fff;
        }

        /* Рука игрока */
        .hand-container {
            display: flex;
            justify-content: center;
            width: 100%;
            min-height: 85px;
            margin-bottom: 10px;
        }

        .hand {
            display: flex;
        }

        .hand .card {
            margin-left: -15px;
        }

        .hand .card:first-child {
            margin-left: 0;
        }

        /* Нижние действия */
        .actions-panel {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .btn-icon {
            width: 38px;
            height: 38px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>ДУРАК</h1>

        <!-- Панель управления -->
        <div class="controls-panel">
            <div class="toggle-group" id="mode-toggle">
                <button class="toggle-btn active" onclick="setGameMode('podkidnoy')" title="Подкидной">Подкидной</button>
                <button class="toggle-btn" onclick="setGameMode('perevodnoy')" title="Переводной">Переводной</button>
            </div>

            <div class="toggle-group" id="bots-toggle">
                <button class="toggle-btn active" onclick="setBotCount(1)" title="1 Бот">1🤖</button>
                <button class="toggle-btn" onclick="setBotCount(2)" title="2 Бота">2🤖</button>
                <button class="toggle-btn" onclick="setBotCount(3)" title="3 Бота">3🤖</button>
            </div>

            <div class="toggle-group" id="diff-toggle">
                <button class="toggle-btn" onclick="setDifficulty('easy')" title="Новичок">🥉</button>
                <button class="toggle-btn active" onclick="setDifficulty('medium')" title="Любитель">🥈</button>
                <button class="toggle-btn" onclick="setDifficulty('hard')" title="Опытный">🥇</button>
            </div>
        </div>

        <div id="bots-info" class="bots-info"></div>

        <div id="status" class="status">Ваш ход</div>

        <!-- Игровой стол -->
        <div class="table-area">
            <div class="deck-zone">
                <span class="deck-count" id="deck-count">36</span>
                <div id="trump-card" class="card trump-card-bg"></div>
                <div id="deck-back" class="card card-back"></div>
                <div id="trump-empty-icon" class="trump-suit-empty"></div>
            </div>

            <div id="table-cards" class="table-cards"></div>
        </div>

        <!-- Рука игрока -->
        <div class="hand-container">
            <div id="player-hand" class="hand"></div>
        </div>

        <!-- Панель действий -->
        <div class="actions-panel">
            <button id="btn-pass" class="btn-action" onclick="playerPassOrTake()">Бито / Взять</button>
            <button class="btn-action btn-icon" onclick="resetGame()" title="Новая игра">🔄</button>
        </div>
    </div>

    <script>
        const SUITS = ['♠', '♥', '♦', '♣'];
        const RANKS = ['6', '7', '8', '9', '10', 'J', 'Q', 'K', 'A'];
        const RANK_VALUES = { '6': 6, '7': 7, '8': 8, '9': 9, '10': 10, 'J': 11, 'Q': 12, 'K': 13, 'A': 14 };

        let gameMode = 'podkidnoy';
        let numBots = 1;
        let difficulty = 'medium';

        let deck = [];
        let trumpCard = null;
        let trumpSuit = null;

        let playerHand = [];
        let bots = [];
        let table = [];

        let playerFinished = false;
        let winnersOrder = [];

        let attackerIndex = 0; // 0 - Игрок, 1..N - Боты
        let defenderIndex = 1;

        function setGameMode(mode) {
            gameMode = mode;
            const btns = document.querySelectorAll('#mode-toggle .toggle-btn');
            btns.forEach(b => b.classList.remove('active'));
            if (mode === 'podkidnoy') btns[0].classList.add('active');
            if (mode === 'perevodnoy') btns[1].classList.add('active');
            resetGame();
        }

        function setBotCount(count) {
            numBots = count;
            const btns = document.querySelectorAll('#bots-toggle .toggle-btn');
            btns.forEach(b => b.classList.remove('active'));
            btns[count - 1].classList.add('active');
            resetGame();
        }

        function setDifficulty(diff) {
            difficulty = diff;
            const btns = document.querySelectorAll('#diff-toggle .toggle-btn');
            btns.forEach(b => b.classList.remove('active'));
            if (diff === 'easy') btns[0].classList.add('active');
            if (diff === 'medium') btns[1].classList.add('active');
            if (diff === 'hard') btns[2].classList.add('active');
        }

        function createDeck() {
            deck = [];
            for (let suit of SUITS) {
                for (let rank of RANKS) {
                    deck.push({ suit, rank, val: RANK_VALUES[rank], isRed: suit === '♥' || suit === '♦' });
                }
            }
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function initGame() {
            createDeck();
            trumpCard = deck[0];
            trumpSuit = trumpCard.suit;

            playerHand = [];
            playerFinished = false;
            winnersOrder = [];

            bots = [];
            for (let i = 0; i < numBots; i++) {
                bots.push({ id: i + 1, hand: [], finished: false });
            }

            table = [];
            attackerIndex = 0;
            defenderIndex = 1;

            dealCards();
            renderAll();
        }

        function dealCards() {
            // Добирает карты сначала атакующий, затем защищающийся, потом остальные
            if (!playerFinished && playerHand.length < 6 && deck.length > 0) {
                while (playerHand.length < 6 && deck.length > 0) playerHand.push(deck.pop());
            }

            bots.forEach(bot => {
                if (!bot.finished && bot.hand.length < 6 && deck.length > 0) {
                    while (bot.hand.length < 6 && deck.length > 0) bot.hand.push(deck.pop());
                }
            });

            checkFinishedPlayers();
        }

        function checkFinishedPlayers() {
            if (deck.length === 0) {
                if (!playerFinished && playerHand.length === 0) {
                    playerFinished = true;
                    winnersOrder.push('Игрок');
                }
                bots.forEach(bot => {
                    if (!bot.finished && bot.hand.length === 0) {
                        bot.finished = true;
                        winnersOrder.push(`Бот ${bot.id}`);
                    }
                });
            }
        }

        function getDefenderHandCount() {
            if (defenderIndex === 0) return playerHand.length;
            return bots[defenderIndex - 1].hand.length;
        }

        function renderAll() {
            renderDeck();
            renderBotsInfo();
            renderTable();
            renderPlayerHand();
            updateStatusAndActionBtn();
        }

        function renderDeck() {
            document.getElementById('deck-count').textContent = deck.length;
            const trumpEl = document.getElementById('trump-card');
            const deckBackEl = document.getElementById('deck-back');
            const emptyIconEl = document.getElementById('trump-empty-icon');

            if (deck.length > 0) {
                trumpEl.style.display = 'flex';
                trumpEl.className = `card trump-card-bg ${trumpCard.isRed ? 'red' : 'black'}`;
                trumpEl.innerHTML = `<div>${trumpCard.rank}</div><div style="font-size:1.2rem; text-align:center;">${trumpCard.suit}</div>`;
                emptyIconEl.style.display = 'none';
                deckBackEl.style.display = deck.length > 1 ? 'block' : 'none';
            } else {
                // Колода пуста — показываем только значок козырной масти
                trumpEl.style.display = 'none';
                deckBackEl.style.display = 'none';
                emptyIconEl.style.display = 'block';
                emptyIconEl.textContent = trumpSuit;
                emptyIconEl.className = `trump-suit-empty ${trumpSuit === '♥' || trumpSuit === '♦' ? 'red' : 'black'}`;
            }
        }

        function renderBotsInfo() {
            const container = document.getElementById('bots-info');
            container.innerHTML = '';
            bots.forEach((bot, idx) => {
                const badge = document.createElement('div');
                badge.className = `bot-badge ${attackerIndex === idx + 1 ? 'active-attacker' : ''} ${bot.finished ? 'finished' : ''}`;
                badge.textContent = bot.finished ? `Бот ${bot.id}: Вышел!` : `Бот ${bot.id}: ${bot.hand.length} к.`;
                container.appendChild(badge);
            });
        }

        function renderTable() {
            const tableEl = document.getElementById('table-cards');
            tableEl.innerHTML = '';

            table.forEach(pair => {
                const pairEl = document.createElement('div');
                pairEl.className = 'card-pair';

                const attCard = createCardEl(pair.attack);
                pairEl.appendChild(attCard);

                if (pair.defend) {
                    const defCard = createCardEl(pair.defend);
                    defCard.classList.add('defending-card');
                    pairEl.appendChild(defCard);
                }

                tableEl.appendChild(pairEl);
            });
        }

        function createCardEl(card) {
            const cardEl = document.createElement('div');
            cardEl.className = `card ${card.isRed ? 'red' : 'black'}`;
            cardEl.innerHTML = `<div>${card.rank}</div><div style="font-size:1.2rem; text-align:center;">${card.suit}</div><div style="text-align:right;">${card.rank}</div>`;
            return cardEl;
        }

        function renderPlayerHand() {
            const handEl = document.getElementById('player-hand');
            handEl.innerHTML = '';

            playerHand.sort((a,b) => (a.suit === trumpSuit ? a.val + 20 : a.val) - (b.suit === trumpSuit ? b.val + 20 : b.val));

            playerHand.forEach((card, index) => {
                const cardEl = createCardEl(card);
                cardEl.addEventListener('click', () => handlePlayerCardClick(index));
                handEl.appendChild(cardEl);
            });
        }

        function handlePlayerCardClick(index) {
            if (playerFinished) return;

            const card = playerHand[index];
            const maxAllowedSubAttacks = Math.min(6, getDefenderHandCount() + table.filter(p => p.defend).length);

            // Атака игрока
            if (attackerIndex === 0) {
                if (table.length >= maxAllowedSubAttacks) {
                    document.getElementById('status').textContent = '⚠️ Нельзя подкидывать больше карт, чем на руках у защищающегося!';
                    return;
                }

                if (table.length === 0 || table.some(p => p.attack.rank === card.rank || (p.defend && p.defend.rank === card.rank))) {
                    playerHand.splice(index, 1);
                    table.push({ attack: card, defend: null });
                    renderAll();
                    setTimeout(botDefendOrPass, 600);
                }
            } 
            // Защита / Перевод игрока
            else if (defenderIndex === 0) {
                const undefended = table.find(p => !p.defend);

                // Переводной дурак
                if (gameMode === 'perevodnoy' && table.every(p => !p.defend) && card.rank === table[0].attack.rank) {
                    playerHand.splice(index, 1);
                    table.push({ attack: card, defend: null });
                    defenderIndex = getNextActivePlayer(defenderIndex);
                    attackerIndex = 0;
                    renderAll();
                    if (defenderIndex !== 0) setTimeout(botDefendOrPass, 600);
                    return;
                }

                if (undefended && canDefend(undefended.attack, card)) {
                    playerHand.splice(index, 1);
                    undefended.defend = card;
                    renderAll();

                    if (table.every(p => p.defend)) {
                        setTimeout(botSubAttack, 600);
                    }
                }
            }
        }

        function canDefend(att, def) {
            if (def.suit === att.suit) return def.val > att.val;
            if (def.suit === trumpSuit && att.suit !== trumpSuit) return true;
            return false;
        }

        function botDefendOrPass() {
            const undefended = table.find(p => !p.defend);
            if (!undefended) return;

            let bot = bots[defenderIndex - 1];
            let possibleDefends = bot.hand.filter(c => canDefend(undefended.attack, c));

            // Перевод ботом
            if (gameMode === 'perevodnoy' && table.every(p => !p.defend)) {
                let transferCard = bot.hand.find(c => c.rank === undefended.attack.rank);
                if (transferCard) {
                    bot.hand.splice(bot.hand.indexOf(transferCard), 1);
                    table.push({ attack: transferCard, defend: null });
                    defenderIndex = getNextActivePlayer(defenderIndex);
                    renderAll();
                    if (defenderIndex !== 0) setTimeout(botDefendOrPass, 600);
                    return;
                }
            }

            if (possibleDefends.length > 0) {
                possibleDefends.sort((a,b) => (a.suit === trumpSuit ? a.val + 20 : a.val) - (b.suit === trumpSuit ? b.val + 20 : b.val));
                let chosen = possibleDefends[0];
                bot.hand.splice(bot.hand.indexOf(chosen), 1);
                undefended.defend = chosen;
                renderAll();

                setTimeout(botSubAttack, 600);
            } else {
                document.getElementById('status').textContent = `Бот ${defenderIndex} берет карты!`;
                setTimeout(() => {
                    table.forEach(p => {
                        bot.hand.push(p.attack);
                        if (p.defend) bot.hand.push(p.defend);
                    });
                    finishTurn(false);
                }, 1000);
            }
        }

        function botSubAttack() {
            // Если защищающемуся некому или нечего подкидывать
            const maxAllowedSubAttacks = Math.min(6, getDefenderHandCount() + table.filter(p => p.defend).length);

            if (table.length >= maxAllowedSubAttacks) {
                document.getElementById('status').textContent = 'Бито!';
                setTimeout(() => finishTurn(true), 1000);
                return;
            }

            let attacker = attackerIndex === 0 ? null : bots[attackerIndex - 1];
            if (!attacker || attacker.finished) {
                // Если ходивший игрок вышел/пасовал
                document.getElementById('status').textContent = 'Бито!';
                setTimeout(() => finishTurn(true), 1000);
                return;
            }

            let validAttackRanks = new Set();
            table.forEach(p => {
                validAttackRanks.add(p.attack.rank);
                if (p.defend) validAttackRanks.add(p.defend.rank);
            });

            let attackCard = attacker.hand.find(c => validAttackRanks.has(c.rank));

            if (attackCard) {
                attacker.hand.splice(attacker.hand.indexOf(attackCard), 1);
                table.push({ attack: attackCard, defend: null });
                renderAll();

                if (defenderIndex === 0) {
                    document.getElementById('status').textContent = 'Вам подкинули! Отбивайтесь.';
                } else {
                    setTimeout(botDefendOrPass, 600);
                }
            } else {
                document.getElementById('status').textContent = 'Бито!';
                setTimeout(() => finishTurn(true), 1000);
            }
        }

        function playerPassOrTake() {
            if (defenderIndex === 0 && table.some(p => !p.defend)) {
                table.forEach(p => {
                    playerHand.push(p.attack);
                    if (p.defend) playerHand.push(p.defend);
                });
                finishTurn(false);
            } else if (attackerIndex === 0 && table.length > 0) {
                finishTurn(true);
            }
        }

        function getNextActivePlayer(currentIndex) {
            let next = (currentIndex + 1) % (numBots + 1);
            let loopGuard = 0;
            while (isPlayerOut(next) && loopGuard < numBots + 2) {
                next = (next + 1) % (numBots + 1);
                loopGuard++;
            }
            return next;
        }

        function isPlayerOut(index) {
            if (index === 0) return playerFinished;
            return bots[index - 1].finished;
        }

        function finishTurn(bito) {
            table = [];
            dealCards();

            // Проверка конца игры
            let activePlayers = [];
            if (!playerFinished) activePlayers.push(0);
            bots.forEach(b => { if (!b.finished) activePlayers.push(b.id); });

            if (activePlayers.length <= 1) {
                if (activePlayers.length === 1) {
                    let loserName = activePlayers[0] === 0 ? 'Вы (Игрок)' : `Бот ${activePlayers[0]}`;
                    document.getElementById('status').textContent = `🎮 Игра окончена! Дурак: ${loserName}`;
                } else {
                    document.getElementById('status').textContent = '🤝 Ничья! Все карты вышли.';
                }
                return;
            }

            if (bito) {
                attackerIndex = getNextActivePlayer(attackerIndex);
            } else {
                attackerIndex = getNextActivePlayer(defenderIndex);
            }
            defenderIndex = getNextActivePlayer(attackerIndex);

            renderAll();

            if (attackerIndex !== 0) {
                setTimeout(botFirstAttack, 600);
            }
        }

        function botFirstAttack() {
            let bot = bots[attackerIndex - 1];
            if (!bot || bot.finished || bot.hand.length === 0) return;

            bot.hand.sort((a,b) => (a.suit === trumpSuit ? a.val + 20 : a.val) - (b.suit === trumpSuit ? b.val + 20 : b.val));
            let card = bot.hand.shift();

            table.push({ attack: card, defend: null });
            renderAll();

            if (defenderIndex === 0) {
                document.getElementById('status').textContent = 'На вас походили! Отбивайтесь.';
            } else {
                setTimeout(botDefendOrPass, 600);
            }
        }

        function updateStatusAndActionBtn() {
            const btn = document.getElementById('btn-pass');

            if (playerFinished) {
                document.getElementById('status').textContent = '🎉 Вы вышли из игры! Наблюдайте за коном.';
                btn.style.display = 'none';
                return;
            }

            btn.style.display = 'inline-block';
            if (defenderIndex === 0) {
                btn.textContent = 'Взять';
            } else {
                btn.textContent = 'Бито';
            }
        }

        function resetGame() {
            initGame();
        }

        initGame();
    </script>
</body>
</html>

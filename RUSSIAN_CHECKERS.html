<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>РУССКИЕ ШАШКИ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle, #2c3e50 0%, #1a252f 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            max-width: 100%;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 12px;
            font-size: 1.4rem;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Панель управления (все переключатели в ряд) */
        .controls-panel {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap;
        }

        .toggle-group {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 3px;
            gap: 2px;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            padding: 6px 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
            min-width: 36px;
        }

        .toggle-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .toggle-btn.active {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .status {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #00e676;
            min-height: 22px;
        }

        /* Адаптивная доска */
        .checkersboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: min(88vw, 400px);
            height: min(88vw, 400px);
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            margin: 0 auto 14px auto;
            overflow: hidden;
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .square.white { background-color: #f0d9b5; }
        .square.black { background-color: #b58863; }
        .square.selected { background-color: #baca44 !important; }

        .square.highlight::after {
            content: '';
            width: 28%;
            height: 28%;
            background-color: rgba(0, 0, 0, 0.35);
            border-radius: 50%;
            position: absolute;
        }

        .checker {
            width: 76%;
            height: 76%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.3);
            transition: transform 0.15s ease;
            z-index: 2;
        }

        .checker.white-piece {
            background: radial-gradient(circle at 30% 30%, #ffffff, #cccccc);
            border: 2px solid #999;
            color: #d4af37;
        }

        .checker.black-piece {
            background: radial-gradient(circle at 30% 30%, #444444, #111111);
            border: 2px solid #000;
            color: #ffd700;
        }

        .checker.king::after {
            content: '👑';
            font-size: min(4vw, 20px);
        }

        .btn-restart {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-restart:hover {
            background: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>РУССКИЕ ШАШКИ</h1>
        
        <!-- Панель управления в ряд -->
        <div class="controls-panel">
            <div class="toggle-group" id="color-toggle">
                <button class="toggle-btn" onclick="setColor('w')" title="Белые">⚪</button>
                <button class="toggle-btn active" onclick="setColor('random')" title="Случайный цвет">🎲</button>
                <button class="toggle-btn" onclick="setColor('b')" title="Чёрные">⚫</button>
            </div>

            <div class="toggle-group" id="diff-toggle">
                <button class="toggle-btn" onclick="setDifficulty('easy')" title="Новичок">🥉</button>
                <button class="toggle-btn active" onclick="setDifficulty('medium')" title="Любитель">🥈</button>
                <button class="toggle-btn" onclick="setDifficulty('hard')" title="Опытный">🥇</button>
            </div>
        </div>

        <div id="status" class="status">Ваш ход</div>
        
        <div id="board" class="checkersboard"></div>

        <button class="btn-restart" onclick="resetGame()">Новая игра</button>
    </div>

    <script>
        let boardState = [];
        let playerColor = 'w';
        let selectedColorMode = 'random';
        let currentDifficulty = 'medium';
        let turn = 'w';

        let selectedPiece = null;
        let validMoves = [];
        let mustJump = false;
        let isMultiJump = false;

        function setColor(mode) {
            selectedColorMode = mode;
            const btns = document.querySelectorAll('#color-toggle .toggle-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            if (mode === 'w') btns[0].classList.add('active');
            if (mode === 'random') btns[1].classList.add('active');
            if (mode === 'b') btns[2].classList.add('active');
            resetGame();
        }

        function setDifficulty(diff) {
            currentDifficulty = diff;
            const btns = document.querySelectorAll('#diff-toggle .toggle-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            if (diff === 'easy') btns[0].classList.add('active');
            if (diff === 'medium') btns[1].classList.add('active');
            if (diff === 'hard') btns[2].classList.add('active');
        }

        function initBoard() {
            boardState = Array(8).fill(null).map(() => Array(8).fill(null));
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) {
                        if (r < 3) boardState[r][c] = { color: 'b', isKing: false };
                        else if (r > 4) boardState[r][c] = { color: 'w', isKing: false };
                    }
                }
            }
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';

            const rows = playerColor === 'w' ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
            const cols = playerColor === 'w' ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];

            for (let r of rows) {
                for (let c of cols) {
                    const square = document.createElement('div');
                    square.className = `square ${(r + c) % 2 === 0 ? 'white' : 'black'}`;
                    
                    if (selectedPiece && selectedPiece.r === r && selectedPiece.c === c) {
                        square.classList.add('selected');
                    }

                    if (validMoves.some(m => m.r === r && m.c === c)) {
                        square.classList.add('highlight');
                    }

                    const piece = boardState[r][c];
                    if (piece) {
                        const checker = document.createElement('div');
                        checker.className = `checker ${piece.color === 'w' ? 'white-piece' : 'black-piece'} ${piece.isKing ? 'king' : ''}`;
                        square.appendChild(checker);
                    }

                    square.addEventListener('click', () => handleSquareClick(r, c));
                    boardEl.appendChild(square);
                }
            }
            updateStatus();
        }

        function getAllJumpMoves(color) {
            let jumps = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (boardState[r][c] && boardState[r][c].color === color) {
                        let pieceJumps = getPieceMoves(r, c, true);
                        if (pieceJumps.length > 0) {
                            jumps.push({ r, c, moves: pieceJumps });
                        }
                    }
                }
            }
            return jumps;
        }

        function getPieceMoves(r, c, jumpsOnly = false) {
            const piece = boardState[r][c];
            if (!piece) return [];

            let moves = [];
            const dirs = [[-1,-1], [-1,1], [1,-1], [1,1]];

            if (piece.isKing) {
                for (let d of dirs) {
                    let step = 1;
                    let foundEnemy = null;

                    while (true) {
                        let nr = r + d[0] * step;
                        let nc = c + d[1] * step;

                        if (nr < 0 || nr >= 8 || nc < 0 || nc >= 8) break;

                        let target = boardState[nr][nc];

                        if (!foundEnemy) {
                            if (!target) {
                                if (!jumpsOnly) moves.push({ r: nr, c: nc });
                            } else if (target.color !== piece.color) {
                                foundEnemy = { r: nr, c: nc };
                            } else {
                                break;
                            }
                        } else {
                            if (!target) {
                                moves.push({ r: nr, c: nc, jumpR: foundEnemy.r, jumpC: foundEnemy.c });
                            } else {
                                break;
                            }
                        }
                        step++;
                    }
                }
            } else {
                const forwardDirs = piece.color === 'w' ? [[-1,-1], [-1,1]] : [[1,-1], [1,1]];

                for (let d of forwardDirs) {
                    let mr = r + d[0];
                    let mc = c + d[1];
                    let jr = r + d[0] * 2;
                    let jc = c + d[1] * 2;

                    if (jr >= 0 && jr < 8 && jc >= 0 && jc < 8) {
                        let mid = boardState[mr][mc];
                        let target = boardState[jr][jc];
                        if (mid && mid.color !== piece.color && !target) {
                            moves.push({ r: jr, c: jc, jumpR: mr, jumpC: mc });
                        }
                    }
                }

                if (!jumpsOnly && moves.length === 0) {
                    for (let d of forwardDirs) {
                        let nr = r + d[0];
                        let nc = c + d[1];
                        if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !boardState[nr][nc]) {
                            moves.push({ r: nr, c: nc });
                        }
                    }
                }
            }

            if (jumpsOnly) {
                return moves.filter(m => m.jumpR !== undefined);
            }

            return moves;
        }

        function handleSquareClick(r, c) {
            if (turn !== playerColor) return;

            const allJumps = getAllJumpMoves(playerColor);
            mustJump = allJumps.length > 0;

            const piece = boardState[r][c];

            if (piece && piece.color === playerColor) {
                if (mustJump && !allJumps.some(j => j.r === r && j.c === c)) {
                    document.getElementById('status').textContent = '⚠️ Обязательный сруб!';
                    return;
                }
                if (isMultiJump && (selectedPiece.r !== r || selectedPiece.c !== c)) {
                    return;
                }

                selectedPiece = { r, c };
                validMoves = getPieceMoves(r, c, mustJump);
                renderBoard();
                return;
            }

            if (selectedPiece && validMoves.some(m => m.r === r && m.c === c)) {
                let chosenMove = validMoves.find(m => m.r === r && m.c === c);
                makeMove(selectedPiece.r, selectedPiece.c, chosenMove);
            }
        }

        function makeMove(fromR, fromC, move) {
            let piece = boardState[fromR][fromC];
            boardState[move.r][move.c] = piece;
            boardState[fromR][fromC] = null;

            if ((piece.color === 'w' && move.r === 0) || (piece.color === 'b' && move.r === 7)) {
                piece.isKing = true;
            }

            if (move.jumpR !== undefined) {
                boardState[move.jumpR][move.jumpC] = null;

                let extraJumps = getPieceMoves(move.r, move.c, true);
                if (extraJumps.length > 0) {
                    selectedPiece = { r: move.r, c: move.c };
                    validMoves = extraJumps;
                    isMultiJump = true;
                    renderBoard();
                    
                    if (turn !== playerColor) {
                        setTimeout(() => makeMove(move.r, move.c, extraJumps[0]), 400);
                    }
                    return;
                }
            }

            selectedPiece = null;
            validMoves = [];
            isMultiJump = false;

            turn = turn === 'w' ? 'b' : 'w';
            renderBoard();

            if (turn !== playerColor) {
                setTimeout(botMove, 600);
            }
        }

        function botMove() {
            if (checkGameOver()) return;

            let botColor = playerColor === 'w' ? 'b' : 'w';
            let allJumps = getAllJumpMoves(botColor);
            let availableMoves = [];

            if (allJumps.length > 0) {
                allJumps.forEach(j => {
                    j.moves.forEach(m => availableMoves.push({ fromR: j.r, fromC: j.c, move: m }));
                });
            } else {
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        if (boardState[r][c] && boardState[r][c].color === botColor) {
                            let moves = getPieceMoves(r, c, false);
                            moves.forEach(m => availableMoves.push({ fromR: r, fromC: c, move: m }));
                        }
                    }
                }
            }

            if (availableMoves.length === 0) return;

            let chosen = availableMoves[Math.floor(Math.random() * availableMoves.length)];

            if (currentDifficulty === 'medium' || currentDifficulty === 'hard') {
                let kingMoves = availableMoves.filter(m => boardState[m.fromR][m.fromC].isKing);
                if (kingMoves.length > 0 && Math.random() < 0.7) chosen = kingMoves[Math.floor(Math.random() * kingMoves.length)];
            }

            makeMove(chosen.fromR, chosen.fromC, chosen.move);
        }

        function checkGameOver() {
            let myPieces = 0, botPieces = 0;

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (boardState[r][c]) {
                        if (boardState[r][c].color === playerColor) myPieces++;
                        else botPieces++;
                    }
                }
            }

            if (myPieces === 0) {
                document.getElementById('status').textContent = '🤖 Бот выиграл!';
                return true;
            }
            if (botPieces === 0) {
                document.getElementById('status').textContent = '🎉 Вы победили!';
                return true;
            }
            return false;
        }

        function updateStatus() {
            if (checkGameOver()) return;
            document.getElementById('status').textContent = turn === playerColor ? 'Ваш ход' : 'Бот думает...';
        }

        function resetGame() {
            if (selectedColorMode === 'random') {
                playerColor = Math.random() < 0.5 ? 'w' : 'b';
            } else {
                playerColor = selectedColorMode;
            }

            turn = 'w';
            selectedPiece = null;
            validMoves = [];
            isMultiJump = false;

            initBoard();
            renderBoard();

            if (playerColor === 'b') {
                setTimeout(botMove, 600);
            }
        }

        resetGame();
    </script>
</body>
</html>

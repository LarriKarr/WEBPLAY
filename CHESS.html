<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ШАХМАТЫ</title>
    <!-- Подключаем библиотеку chess.js для валидации правил -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle, #2c3e50 0%, #1a252f 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            max-width: 100%;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 1.4rem;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Панель управления */
        .controls-panel {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .toggle-group {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 3px;
            gap: 2px;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            padding: 5px 10px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
            min-width: 34px;
        }

        .toggle-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .toggle-btn.active {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Главная игровая зона */
        .main-game-area {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Панель часов и статуса */
        .info-bar {
            display: flex;
            justify-content: space-between;
            width: min(88vw, 400px);
            font-size: 0.9rem;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 4px;
            padding: 0 4px;
        }

        .timer {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .timer.active {
            border-color: #00e676;
            color: #00e676;
        }

        .status {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #00e676;
            min-height: 20px;
        }

        /* Шахматная доска */
        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: min(88vw, 400px);
            height: min(88vw, 400px);
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.4rem, 6vw, 2.2rem);
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        .square.white { background-color: #f0d9b5; }
        .square.black { background-color: #b58863; }
        .square.selected { background-color: #baca44 !important; }

        .square.highlight::after {
            content: '';
            width: 28%;
            height: 28%;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            position: absolute;
        }

        .piece-white { color: #ffffff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .piece-black { color: #111111; text-shadow: 0 1px 2px rgba(255,255,255,0.4); }

        /* История ходов */
        .history-panel {
            width: 150px;
            height: min(88vw, 400px);
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .history-title {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #ffd700;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
            font-size: 0.85rem;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .history-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 4px;
            border-radius: 3px;
        }

        .history-row:nth-child(odd) {
            background: rgba(255, 255, 255, 0.03);
        }

        /* Нижняя панель действий (одинаковые кнопки со значками) */
        .actions-panel {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 42px;
            height: 42px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Модальное окно выбора фигуры */
        #promotion-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 16px;
            z-index: 10;
        }

        .modal-content {
            background: #2c3e50;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
        }

        .promo-pieces {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            font-size: 2.2rem;
            justify-content: center;
            cursor: pointer;
        }

        .promo-pieces span {
            background: #f0d9b5;
            padding: 4px 10px;
            border-radius: 6px;
            transition: transform 0.2s;
        }

        .promo-pieces span:hover {
            transform: scale(1.1);
            background: #baca44;
        }

        @media (max-width: 580px) {
            .main-game-area {
                flex-direction: column;
                align-items: center;
            }
            .history-panel {
                width: min(88vw, 400px);
                height: 100px;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>ШАХМАТЫ</h1>
        
        <!-- Панель управления -->
        <div class="controls-panel">
            <!-- Выбор цвета -->
            <div class="toggle-group" id="color-toggle">
                <button class="toggle-btn" onclick="setColor('w')" title="Белые">♔</button>
                <button class="toggle-btn active" onclick="setColor('random')" title="Случайный цвет">🎲</button>
                <button class="toggle-btn" onclick="setColor('b')" title="Чёрные">♚</button>
            </div>

            <!-- Сложность бота -->
            <div class="toggle-group" id="diff-toggle">
                <button class="toggle-btn" onclick="setDifficulty('easy')" title="Новичок">🥉</button>
                <button class="toggle-btn active" onclick="setDifficulty('medium')" title="Любитель">🥈</button>
                <button class="toggle-btn" onclick="setDifficulty('hard')" title="Опытный">🥇</button>
            </div>

            <!-- Время на партию -->
            <div class="toggle-group" id="time-toggle">
                <button class="toggle-btn" onclick="setTimeControl(180)" title="3 минуты">3м</button>
                <button class="toggle-btn active" onclick="setTimeControl(300)" title="5 минут">5м</button>
                <button class="toggle-btn" onclick="setTimeControl(0)" title="Без времени">∞</button>
            </div>
        </div>

        <div id="status" class="status">Ваш ход</div>
        
        <!-- Основная игровая зона -->
        <div class="main-game-area">
            <div>
                <div class="info-bar">
                    <span id="bot-timer-label">Бот: <span id="bot-time" class="timer">05:00</span></span>
                    <span id="player-timer-label">Вы: <span id="player-time" class="timer">05:00</span></span>
                </div>
                <div id="chessboard" class="chessboard"></div>
            </div>

            <!-- История ходов -->
            <div class="history-panel">
                <div class="history-title">Запись ходов</div>
                <div id="history-list" class="history-list"></div>
            </div>
        </div>

        <!-- Панель действий (одинаковые кнопки со значками) -->
        <div class="actions-panel">
            <button class="btn-action" onclick="resetGame()" title="Новая игра">🔄</button>
            <button class="btn-action" onclick="saveGameToFile()" title="Сохранить игру">💾</button>
            <button class="btn-action" onclick="document.getElementById('file-input').click()" title="Загрузить игру">📂</button>
            <input type="file" id="file-input" style="display: none;" accept=".json" onchange="loadGameFromFile(event)">
        </div>

        <!-- Модалка превращения пешки -->
        <div id="promotion-modal">
            <div class="modal-content">
                <p style="color: #fff; font-weight: bold;">Выберите фигуру:</p>
                <div class="promo-pieces" id="promo-pieces-container"></div>
            </div>
        </div>
    </div>

    <script>
        const game = new Chess();
        const unicodePieces = {
            'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
            'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
        };

        const pieceValues = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };

        let selectedColorMode = 'random';
        let playerColor = 'w';
        let currentDifficulty = 'medium';
        let timeControl = 300;

        let playerTimeLeft = 300;
        let botTimeLeft = 300;
        let timerInterval = null;

        let selectedSquare = null;
        let possibleMoves = [];
        let pendingPromotion = null;

        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

        function setColor(mode) {
            selectedColorMode = mode;
            const btns = document.querySelectorAll('#color-toggle .toggle-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            if (mode === 'w') btns[0].classList.add('active');
            if (mode === 'random') btns[1].classList.add('active');
            if (mode === 'b') btns[2].classList.add('active');
            resetGame();
        }

        function setDifficulty(diff) {
            currentDifficulty = diff;
            const btns = document.querySelectorAll('#diff-toggle .toggle-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            if (diff === 'easy') btns[0].classList.add('active');
            if (diff === 'medium') btns[1].classList.add('active');
            if (diff === 'hard') btns[2].classList.add('active');
            autoSaveLocalStorage();
        }

        function setTimeControl(seconds) {
            timeControl = seconds;
            const btns = document.querySelectorAll('#time-toggle .toggle-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            if (seconds === 180) btns[0].classList.add('active');
            if (seconds === 300) btns[1].classList.add('active');
            if (seconds === 0) btns[2].classList.add('active');
            resetGame();
        }

        function startTimer() {
            clearInterval(timerInterval);
            if (timeControl === 0 || game.game_over()) return;

            timerInterval = setInterval(() => {
                if (game.turn() === playerColor) {
                    if (playerTimeLeft > 0) {
                        playerTimeLeft--;
                        updateClockDisplay();
                    } else {
                        clearInterval(timerInterval);
                        document.getElementById('status').textContent = '⏰ Время вышло! Вы проиграли.';
                        freezeGame();
                    }
                } else {
                    if (botTimeLeft > 0) {
                        botTimeLeft--;
                        updateClockDisplay();
                    } else {
                        clearInterval(timerInterval);
                        document.getElementById('status').textContent = '⏰ Время вышло! Бот проиграл.';
                        freezeGame();
                    }
                }
            }, 1000);
        }

        function formatTime(seconds) {
            let m = Math.floor(seconds / 60);
            let s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateClockDisplay() {
            document.getElementById('player-time').textContent = formatTime(playerTimeLeft);
            document.getElementById('bot-time').textContent = formatTime(botTimeLeft);

            const pTimerEl = document.getElementById('player-time');
            const bTimerEl = document.getElementById('bot-time');

            pTimerEl.classList.remove('active');
            bTimerEl.classList.remove('active');

            if (!game.game_over()) {
                if (game.turn() === playerColor) pTimerEl.classList.add('active');
                else bTimerEl.classList.add('active');
            }
        }

        function freezeGame() {
            selectedSquare = null;
            possibleMoves = [];
            renderBoard();
        }

        function renderBoard() {
            const boardEl = document.getElementById('chessboard');
            boardEl.innerHTML = '';

            const boardData = game.board();

            const rows = playerColor === 'w' ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
            const cols = playerColor === 'w' ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];

            for (let r of rows) {
                for (let c of cols) {
                    const square = document.createElement('div');
                    square.className = `square ${(r + c) % 2 === 0 ? 'white' : 'black'}`;
                    
                    let squareName = files[c] + (8 - r);
                    square.dataset.square = squareName;

                    if (selectedSquare === squareName) square.classList.add('selected');
                    if (possibleMoves.includes(squareName)) square.classList.add('highlight');

                    const piece = boardData[r][c];
                    if (piece) {
                        const span = document.createElement('span');
                        span.className = piece.color === 'w' ? 'piece-white' : 'piece-black';
                        span.textContent = unicodePieces[piece.color === 'w' ? piece.type.toUpperCase() : piece.type];
                        square.appendChild(span);
                    }

                    square.addEventListener('click', () => handleSquareClick(squareName));
                    boardEl.appendChild(square);
                }
            }
            renderHistory();
            updateStatus();
            updateClockDisplay();
        }

        function renderHistory() {
            const historyList = document.getElementById('history-list');
            const history = game.history();
            historyList.innerHTML = '';

            for (let i = 0; i < history.length; i += 2) {
                let row = document.createElement('div');
                row.className = 'history-row';
                
                let moveNum = Math.floor(i / 2) + 1;
                let whiteMove = history[i];
                let blackMove = history[i + 1] || '';

                row.innerHTML = `<span>${moveNum}. ${whiteMove}</span><span>${blackMove}</span>`;
                historyList.appendChild(row);
            }
            historyList.scrollTop = historyList.scrollHeight;
        }

        function handleSquareClick(sq) {
            if (game.game_over() || game.turn() !== playerColor) return;

            if (selectedSquare === null) {
                const piece = game.get(sq);
                if (piece && piece.color === playerColor) {
                    selectedSquare = sq;
                    possibleMoves = game.moves({ square: sq, verbose: true }).map(m => m.to);
                    renderBoard();
                }
            } else {
                if (possibleMoves.includes(sq)) {
                    let piece = game.get(selectedSquare);
                    if (piece && piece.type === 'p' && (sq[1] === '8' || sq[1] === '1')) {
                        pendingPromotion = { from: selectedSquare, to: sq };
                        openPromotionModal();
                        return;
                    }

                    executeMove({ from: selectedSquare, to: sq });
                } else {
                    selectedSquare = null;
                    possibleMoves = [];
                    renderBoard();
                }
            }
        }

        function openPromotionModal() {
            const container = document.getElementById('promo-pieces-container');
            const isWhite = playerColor === 'w';
            container.innerHTML = `
                <span onclick="promotePiece('q')">${isWhite ? '♕' : '♛'}</span>
                <span onclick="promotePiece('r')">${isWhite ? '♖' : '♜'}</span>
                <span onclick="promotePiece('b')">${isWhite ? '♗' : '♝'}</span>
                <span onclick="promotePiece('n')">${isWhite ? '♘' : '♞'}</span>
            `;
            document.getElementById('promotion-modal').style.display = 'flex';
        }

        function promotePiece(promoChar) {
            document.getElementById('promotion-modal').style.display = 'none';
            if (pendingPromotion) {
                executeMove({
                    from: pendingPromotion.from,
                    to: pendingPromotion.to,
                    promotion: promoChar
                });
                pendingPromotion = null;
            }
        }

        function executeMove(moveObj) {
            let move = game.move(moveObj);
            selectedSquare = null;
            possibleMoves = [];
            renderBoard();
            autoSaveLocalStorage();

            if (game.game_over()) {
                clearInterval(timerInterval);
                return;
            }

            if (move && game.turn() !== playerColor) {
                document.getElementById('status').textContent = 'Бот думает...';
                startTimer();
                setTimeout(botMove, 500);
            }
        }

        function botMove() {
            if (game.game_over()) return;

            const moves = game.moves({ verbose: true });
            if (moves.length === 0) return;

            let chosenMove = null;

            if (currentDifficulty === 'easy') {
                chosenMove = moves[Math.floor(Math.random() * moves.length)];
            } else if (currentDifficulty === 'medium') {
                let captures = moves.filter(m => m.captured);
                if (captures.length > 0) {
                    captures.sort((a, b) => pieceValues[b.captured] - pieceValues[a.captured]);
                    chosenMove = captures[0];
                } else {
                    chosenMove = moves[Math.floor(Math.random() * moves.length)];
                }
            } else if (currentDifficulty === 'hard') {
                let bestScore = -9999;
                for (let move of moves) {
                    game.move(move);
                    let score = evaluateBoard(game.turn());
                    game.undo();

                    if (score > bestScore) {
                        bestScore = score;
                        chosenMove = move;
                    }
                }
            }

            if (!chosenMove) chosenMove = moves[Math.floor(Math.random() * moves.length)];

            game.move(chosenMove);
            renderBoard();
            autoSaveLocalStorage();

            if (game.game_over()) {
                clearInterval(timerInterval);
            } else {
                startTimer();
            }
        }

        function evaluateBoard(currentTurn) {
            let total = 0;
            const board = game.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = board[r][c];
                    if (p) {
                        let val = pieceValues[p.type];
                        if ((r === 3 || r === 4) && (c === 3 || c === 4)) val += 3;

                        if (p.color !== playerColor) total += val;
                        else total -= val;
                    }
                }
            }
            return total;
        }

        function updateStatus() {
            const statusEl = document.getElementById('status');
            if (game.in_checkmate()) {
                statusEl.textContent = game.turn() === playerColor ? '🤖 Бот поставил мат!' : '🎉 Мат! Вы победили!';
            } else if (game.in_draw()) {
                statusEl.textContent = '🤝 Ничья!';
            } else if (game.in_check()) {
                statusEl.textContent = game.turn() === playerColor ? '⚠️ Шах вам!' : '⚠️ Шах боту!';
            } else {
                statusEl.textContent = game.turn() === playerColor ? 'Ваш ход' : 'Бот думает...';
            }
        }

        function getSaveData() {
            return {
                fen: game.fen(),
                playerColor: playerColor,
                selectedColorMode: selectedColorMode,
                difficulty: currentDifficulty,
                timeControl: timeControl,
                playerTimeLeft: playerTimeLeft,
                botTimeLeft: botTimeLeft,
                pgn: game.pgn()
            };
        }

        function autoSaveLocalStorage() {
            localStorage.setItem('chess_autosave', JSON.stringify(getSaveData()));
        }

        function saveGameToFile() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(getSaveData(), null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `chess_save_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function loadGameFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const saveData = JSON.parse(e.target.result);
                    applySaveData(saveData);
                } catch (err) {
                    alert('Ошибка чтения файла сохранения!');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function applySaveData(data) {
            if (!data || !data.fen) return;

            game.load(data.fen);
            playerColor = data.playerColor || 'w';
            selectedColorMode = data.selectedColorMode || 'w';
            currentDifficulty = data.difficulty || 'medium';
            timeControl = data.timeControl !== undefined ? data.timeControl : 300;
            playerTimeLeft = data.playerTimeLeft !== undefined ? data.playerTimeLeft : timeControl;
            botTimeLeft = data.botTimeLeft !== undefined ? data.botTimeLeft : timeControl;

            updateToggleButtonsUI();

            selectedSquare = null;
            possibleMoves = [];
            renderBoard();

            if (!game.game_over()) {
                startTimer();
                if (game.turn() !== playerColor) {
                    document.getElementById('status').textContent = 'Бот думает...';
                    setTimeout(botMove, 600);
                }
            }
        }

        function updateToggleButtonsUI() {
            const colorBtns = document.querySelectorAll('#color-toggle .toggle-btn');
            colorBtns.forEach(b => b.classList.remove('active'));
            if (selectedColorMode === 'w') colorBtns[0].classList.add('active');
            if (selectedColorMode === 'random') colorBtns[1].classList.add('active');
            if (selectedColorMode === 'b') colorBtns[2].classList.add('active');

            const diffBtns = document.querySelectorAll('#diff-toggle .toggle-btn');
            diffBtns.forEach(b => b.classList.remove('active'));
            if (currentDifficulty === 'easy') diffBtns[0].classList.add('active');
            if (currentDifficulty === 'medium') diffBtns[1].classList.add('active');
            if (currentDifficulty === 'hard') diffBtns[2].classList.add('active');

            const timeBtns = document.querySelectorAll('#time-toggle .toggle-btn');
            timeBtns.forEach(b => b.classList.remove('active'));
            if (timeControl === 180) timeBtns[0].classList.add('active');
            if (timeControl === 300) timeBtns[1].classList.add('active');
            if (timeControl === 0) timeBtns[2].classList.add('active');
        }

        function resetGame() {
            game.reset();
            localStorage.removeItem('chess_autosave');
            selectedSquare = null;
            possibleMoves = [];
            document.getElementById('promotion-modal').style.display = 'none';

            if (selectedColorMode === 'random') {
                playerColor = Math.random() < 0.5 ? 'w' : 'b';
            } else {
                playerColor = selectedColorMode;
            }

            playerTimeLeft = timeControl;
            botTimeLeft = timeControl;

            renderBoard();
            startTimer();

            if (playerColor === 'b') {
                document.getElementById('status').textContent = 'Бот делает первый ход...';
                setTimeout(botMove, 600);
            }
        }

        const autoSave = localStorage.getItem('chess_autosave');
        if (autoSave) {
            try {
                applySaveData(JSON.parse(autoSave));
            } catch (e) {
                resetGame();
            }
        } else {
            resetGame();
        }
    </script>
</body>
</html>
